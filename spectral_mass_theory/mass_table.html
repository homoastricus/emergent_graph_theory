<body>

<script>
    // ===== CONSTANTS =====
    const K = 6.0;
    const pi = Math.PI;
    const N_val = 4.1977e121;
    const lnN = Math.log(N_val);

    function toLatex(expr) {
        let result = expr
            // lnN специальные случаи
            .replace(/lnN\^1\s+/g, '\\ln N \\; ')
            .replace(/lnN\^1(?![-\d\{])/g, '\\ln N')
            .replace(/lnN\^\{-1\}/g, '\\ln N^{-1}')
            .replace(/lnN\*\*1\s+/g, '\\ln N \\; ')
            .replace(/lnN\*\*1(?![-\d])/g, '\\ln N')
            .replace(/lnN\*\*\(-1\)/g, '\\ln N^{-1}')
            .replace(/lnN/g, '\\ln N')
            // ** -> ^
            .replace(/\*\*/g, '^')
            // * -> cdot
            .replace(/\*/g, ' \\cdot ')
            // math.sqrt -> \sqrt
            .replace(/math\.sqrt\(([^)]+)\)/g, '\\sqrt{$1}')
            // pi
            .replace(/pi/g, '\\pi')
            // Убираем пробелы вокруг ^
            .replace(/\s*\^\s*/g, '^');

        // Рекурсивно заменяем круглые скобки на фигурные
        let prev = '';
        while (prev !== result) {
            prev = result;
            result = result.replace(/\(([^()]+)\)/g, '{$1}');
        }

        // Заменяем ^{1/2} на \sqrt{...}
        result = result.replace(/\{([^}]+)\}\^\{1\/2\}/g, '\\sqrt{$1}');
        result = result.replace(/\{([^}]+)\}\^\{1\/3\}/g, '\\sqrt[3]{$1}');
        result = result.replace(/([a-zA-Z\\]+)\^\{1\/2\}/g, '\\sqrt{$1}');
        result = result.replace(/([a-zA-Z\\]+)\^\{1\/3\}/g, '\\sqrt[3]{$1}');
        result = result.replace(/(\d+)\^\{1\/2\}/g, '\\sqrt{$1}');
        result = result.replace(/(\d+)\^\{1\/3\}/g, '\\sqrt[3]{$1}');

        // Преобразуем в горизонтальную дробь ТОЛЬКО если есть знак деления
        // и он последний (не внутри фигурных скобок и не внутри frac)
        if (result.includes(' / ') && !result.includes('\\frac')) {
            // Находим ПОСЛЕДНИЙ знак деления на верхнем уровне
            let depth = 0;
            let lastDivPos = -1;
            for (let i = 0; i < result.length - 2; i++) {
                if (result[i] === '{') depth++;
                if (result[i] === '}') depth--;
                if (depth === 0 && result.substring(i, i + 3) === ' / ') {
                    lastDivPos = i;
                }
            }
            if (lastDivPos > 0) {
                const numerator = result.substring(0, lastDivPos);
                const denominator = result.substring(lastDivPos + 3);
                if (numerator && denominator) {
                    result = '\\frac{' + numerator + '}{' + denominator + '}';
                }
            }
        }

        // Оборачиваем оставшиеся показатели степени с дробями в двойные скобки
        result = result.replace(/\^\{([^}]+)\}/g, function (match, content) {
            if (content.includes('/')) {
                return '^{{' + content + '}}';
            }
            return match;
        });

        // Убираем лишние пробелы
        result = result.replace(/^\s+/, '').replace(/\s+$/, '');

        return result;
    }

    const particles = [
        {id: 'm_e_val', name: 'e (электрон)', mass: 9.1093837015e-31, type: 'лептон', ln: 4},
        {id: 'm_qu_u', name: 'u-кварк', mass: 2.1650e-30, type: 'кварк', ln: 5},
        {id: 'm_qu_d', name: 'd-кварк', mass: 4.7915e-30, type: 'кварк', ln: 5},
        {id: 'm_qu_s', name: 's-кварк', mass: 9.635e-30, type: 'кварк', ln: 4},
        {id: 'm_muon', name: 'μ (мюон)', mass: 1.883531627e-28, type: 'лептон', ln: 5},
        {id: 'm_pi0_meson', name: 'π⁰-мезон', mass: 2.40609e-28, type: 'мезон', ln: 4},
        {id: 'm_pi_meson', name: 'π-мезон', mass: 2.4880888e-28, type: 'мезон', ln: 6},
        {id: 'm_k0_meson', name: 'K⁰-мезон', mass: 8.801929e-28, type: 'мезон', ln: 6},
        {id: 'm_eta', name: 'η-мезон', mass: 9.767732e-28, type: 'мезон', ln: 5},
        {id: 'm_qu_c', name: 'c-кварк', mass: 1.27e-27, type: 'кварк', ln: 6},
        {id: 'omega_meson', name: 'ω-мезон', mass: 1.394e-27, type: 'мезон', ln: 5},
        {id: 'm_proton_val', name: 'p (протон)', mass: 1.67262192e-27, type: 'барион', ln: 6},
        {id: 'eta_shtrih', name: "η'-мезон", mass: 1.7086e-27, type: 'мезон', ln: 5},
        {id: 'phi_meson', name: 'φ-мезон', mass: 1.819e-27, type: 'мезон', ln: 5},
        {id: 'm_Λ_barion', name: 'Λ-барион', mass: 1.9901611e-27, type: 'барион', ln: 6},
        {id: 'Sigma_plus', name: 'Σ⁺-барион', mass: 2.11933e-27, type: 'барион', ln: 6},
        {id: 'Sigma_minus', name: 'Σ⁻-барион', mass: 2.132e-27, type: 'барион', ln: 6},
        {id: 'Ksi_0', name: 'Ξ⁰-барион', mass: 2.34532e-27, type: 'барион', ln: 6},
        {id: 'omega_minus', name: 'Ω⁻-барион', mass: 2.9859e-27, type: 'барион', ln: 6},
        {id: 'm_tau', name: 'τ (тау)', mass: 3.167e-27, type: 'лептон', ln: 5},
        {id: 'm_DT', name: 'DT', mass: 3.3435837724e-27, type: 'мезон', ln: 6},
        {id: 'Lambda_plus', name: 'Λ⁺_c-барион', mass: 4.0737e-27, type: 'барион', ln: 6},
        {id: 'm_qu_b', name: 'b-кварк', mass: 4.180e-27, type: 'кварк', ln: 6},
        {id: 'Ksi_plus', name: 'Ξ⁺-барион', mass: 4.3995e-27, type: 'барион', ln: 6},
        {id: 'Omega0_c', name: 'Ω⁰_c-барион', mass: 4.808e-27, type: 'барион', ln: 6},
        {id: 'm_J_ψ', name: 'J/ψ-мезон', mass: 5.52061e-27, type: 'мезон', ln: 5},
        {id: 'lambda_B0', name: 'Λ⁰_b-барион', mass: 1.0023e-26, type: 'барион', ln: 6},
        {id: 'm_Υ_1S', name: 'Υ(1S)-мезон', mass: 1.68715e-26, type: 'мезон', ln: 6},
        {id: 'm_w_bozon', name: 'W-бозон', mass: 1.43362e-25, type: 'бозон', ln: 6},
        {id: 'm_z_bozon', name: 'Z-бозон', mass: 1.62614e-25, type: 'бозон', ln: 6},
        {id: 'm_Higgs', name: 'H (Хиггс)', mass: 2.23319e-25, type: 'бозон', ln: 6},
        {id: 'm_qu_t', name: 't-кварк', mass: 3.04e-25, type: 'кварк', ln: 6}
    ];

    particles.sort((a, b) => a.mass - b.mass);

    const rawRelations = [
        {expr: 'lnN**2 / (4 * K * pi**(1/2))', first_var: 'm_proton_val', second_var: 'm_e_val'},
        {expr: '(K / pi) ** (1/2)', first_var: 'm_Higgs', second_var: 'm_z_bozon'},
        {expr: '2 * math.sqrt(K) / pi', first_var: 'm_Higgs', second_var: 'm_w_bozon'},
        {expr: '4 * pi**2 / (K * 3**(1/2))', first_var: 'm_DT', second_var: 'm_k0_meson'},
        {expr: '2**(1/2) * K**(1/2) / 3**(1/2)', first_var: 'm_DT', second_var: 'm_proton_val'},
        {expr: '2 * pi**(3/2) / K**(3/2)', first_var: 'm_qu_c', second_var: 'm_proton_val'},
        {expr: '4 * pi**2', first_var: 'm_muon', second_var: 'm_qu_d'},
        {expr: 'pi**(1/2) * K**3 * 3**(1/2)', first_var: 'm_tau', second_var: 'm_qu_d'},
        {expr: '8 * pi**2 * 2**(1/2) * K * 3**(1/2)', first_var: 'm_J_ψ', second_var: 'm_qu_d'},
        {expr: '2 / (K * 3**(1/2))', first_var: 'm_muon', second_var: 'm_eta'},
        {expr: '3**(1/2) * K**(3/2) / (2**(1/2) * pi**(1/2))', first_var: 'm_Υ_1S', second_var: 'm_proton_val'},
        {expr: '2*(pi**4)/K**6', first_var: 'm_qu_c', second_var: 'm_qu_t'},
        {expr: '4 / (pi ** (1/2))', first_var: 'm_Λ_barion', second_var: 'm_k0_meson'},
        {expr: '2/(pi ** (1/2))', first_var: 'm_z_bozon', second_var: 'm_w_bozon'},
        {expr: 'pi / (2 * K ** (1 / 2))', first_var: 'm_w_bozon', second_var: 'm_Higgs'},
        {expr: '1/ (math.sqrt(2) * math.sqrt(pi))', first_var: 'm_proton_val', second_var: 'm_qu_b'},
        {expr: 'K * 2**(1/2) / (4 * pi**(9/2))', first_var: 'm_Λ_barion', second_var: 'm_z_bozon'},
        {expr: '(pi) ** (5 / 2) / (K * 3 ** (1 / 2))', first_var: 'm_DT', second_var: 'm_Λ_barion'},
        {expr: '3 ** (1 / 2) * (K**3)/ ((2 ** (1 / 2)) * 2*pi**2)', first_var: 'm_Υ_1S', second_var: 'm_qu_c'},
        {expr: '2 * pi * 3**(1/2) / K**2', first_var: 'm_qu_c', second_var: 'm_qu_b'},
        {expr: 'K**2 / (2 * pi * 3**(1/2))', first_var: 'm_qu_b', second_var: 'm_qu_c'},
        {expr: 'K**4 * math.sqrt(3) / pi**3', first_var: 'm_qu_t', second_var: 'm_qu_b'},
        {expr: '4 * 2**(1/2) * K**3', first_var: 'm_qu_t', second_var: 'm_pi_meson'},
        {expr: '2 * pi**(5/2) * math.sqrt(K)', first_var: 'm_w_bozon', second_var: 'm_proton_val'},
        {expr: '1 / (2*(pi) ** (1 / 2))', first_var: 'm_pi_meson', second_var: 'm_k0_meson'},
        {expr: '4 * (pi ** 2) * K ** (1 / 2)', first_var: 'm_z_bozon', second_var: 'm_proton_val'},
        {expr: '4 * pi ** (3/2) / (K**3 * 3**(1/2))', first_var: 'm_muon', second_var: 'm_tau'},
        {expr: '8 * pi ** (3 / 2) * 2 ** (1 / 2) / K**2', first_var: 'm_J_ψ', second_var: 'm_tau'},
        {expr: '4 * 2 ** (1 / 2)', first_var: 'm_J_ψ', second_var: 'm_eta'},

    const relations = {};
    rawRelations.forEach(r => {
        try {
            let evalExpr = r.expr
                // Сначала заменяем конструкции с lnN
                .replace(/lnN\*\*1/g, 'lnN')
                .replace(/lnN\*\*\(-1\)/g, '(1/lnN)')
                // Добавляем явное умножение ВЕЗДЕ где есть пробел
                .replace(/(\d)\s+(\d)/g, '$1*$2')
                .replace(/(\d)\s+\(/g, '$1*(')
                .replace(/\)\s+(\d)/g, ')*$1')
                .replace(/\)\s+\(/g, ')*(')
                .replace(/(\d)\s+([a-zA-Z])/g, '$1*$2')
                .replace(/\)\s+([a-zA-Z])/g, ')*$1')
                .replace(/([a-zA-Z])\s+(\d)/g, '$1*$2')
                .replace(/([a-zA-Z])\s+\(/g, '$1*(')
                .replace(/([a-zA-Z])\s+([a-zA-Z])/g, '$1*$2')
                // Теперь математические замены
                .replace(/math\.sqrt\(([^)]+)\)/g, 'Math.sqrt($1)')
                .replace(/lnN/g, '(' + lnN + ')')
                .replace(/pi/g, '(' + pi + ')')
                .replace(/K/g, '(' + K + ')');

            const val = eval(evalExpr);

            if (!relations[r.first_var]) relations[r.first_var] = {};
            relations[r.first_var][r.second_var] = {expr: r.expr, value: val};
        } catch (e) {
            console.error('Cannot evaluate:', r.expr, '->', e.message);
        }
    });

    function invertExpr(expr) {
        // Если выражение содержит " / " — меняем числитель и знаменатель
        if (expr.includes(' / ')) {
            const parts = expr.split(' / ');
            if (parts.length === 2) {
                return parts[1] + ' / ' + parts[0];
            }
        }
        // Если это простая дробь без знака деления — оборачиваем в 1/(...)
        return '1 / (' + expr + ')';
    }

    function getModelRatio(id1, id2) {
        if (relations[id1] && relations[id1][id2]) {
            return {...relations[id1][id2], inverted: false};
        }
        if (relations[id2] && relations[id2][id1]) {
            return {
                expr: invertExpr(relations[id2][id1].expr),
                value: 1 / relations[id2][id1].value,
                inverted: true
            };
        }
        return null;
    }

    function formatMass(m) {
        if (m >= 1e-25) return (m * 1e27).toPrecision(4) + '·10⁻²⁷';
        if (m >= 1e-26) return (m * 1e27).toPrecision(4) + '·10⁻²⁷';
        if (m >= 1e-27) return (m * 1e27).toPrecision(4) + '·10⁻²⁷';
        if (m >= 1e-28) return (m * 1e28).toPrecision(4) + '·10⁻²⁸';
        if (m >= 1e-29) return (m * 1e29).toPrecision(4) + '·10⁻²⁹';
        if (m >= 1e-30) return (m * 1e30).toPrecision(4) + '·10⁻³⁰';
        return (m * 1e31).toPrecision(4) + '·10⁻³¹';
    }

    let currentFilter = 0;
    let filteredParticles = [...particles];

    function filterByLn(ln) {
        currentFilter = ln;
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        if (ln === 0) document.getElementById('btn-all').classList.add('active');
        else if (ln === 4) document.getElementById('btn-ln4').classList.add('active');
        else if (ln === 5) document.getElementById('btn-ln5').classList.add('active');
        else if (ln === 6) document.getElementById('btn-ln6').classList.add('active');
        filterTable();
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        filteredParticles = particles.filter(p => {
            const matchLn = currentFilter === 0 || p.ln === currentFilter;
            const matchSearch = !query || p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query);
            return matchLn && matchSearch;
        });
        buildTable();
        buildStats();
    }

    function buildTable() {
        const container = document.getElementById('tableContainer');
        const pList = filteredParticles;

        let html = '<table><thead><tr><th class="corner">Частица ↓ / Частица →</th>';

        pList.forEach(p => {
            const lnClass = 'ln' + p.ln;
            html += `<th class="${lnClass}" title="${p.type} | lnN^${p.ln}">
                    ${p.name}<br><small>${formatMass(p.mass)} кг</small><br><small>${p.type}</small>
                </th>`;
        });
        html += '</tr></thead><tbody>';

        pList.forEach((p1, i) => {
            const lnClass1 = 'ln' + p1.ln;
            html += `<tr class="row-${lnClass1}">`;
            html += `<td class="${lnClass1}" title="${p1.type} | lnN^${p1.ln}">
                    ${p1.name}<br><small>${formatMass(p1.mass)} кг</small><br><small>${p1.type}</small>
                </td>`;

            pList.forEach((p2, j) => {
                if (i === j) {
                    html += `<td class="diagonal"><strong>1</strong></td>`;
                } else {
                    const rel = getModelRatio(p1.id, p2.id);
                    if (rel) {
                        const modelVal = rel.value;
                        const expVal = p1.mass / p2.mass;
                        const teta = modelVal / expVal;
                        const tetaClass = Math.abs(teta - 1) < 0.01 ? 'teta-good' :
                            Math.abs(teta - 1) < 0.05 ? 'teta-ok' : 'teta-bad';
                        const latex = toLatex(rel.expr);

                        html += `<td>
                                <div class="cell-content">
                                    <span class="cell-formula">\\(${latex}\\)</span>
                                    <span class="cell-model">М: ${modelVal.toExponential(4)}</span>
                                    <span class="cell-exp">Э: ${expVal.toExponential(4)}</span>
                                    <span class="cell-teta ${tetaClass}">T: ${teta.toFixed(4)}</span>
                                </div>
                            </td>`;
                    } else {
                        html += `<td class="no-data">—</td>`;
                    }
                }
            });
            html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;

        MathJax.typesetPromise([container]).catch(console.warn);
    }

    function buildStats() {
        const grid = document.getElementById('statsGrid');
        const allTetas = [];

        filteredParticles.forEach((p1, i) => {
            filteredParticles.forEach((p2, j) => {
                if (i !== j) {
                    const rel = getModelRatio(p1.id, p2.id);
                    if (rel) {
                        const expVal = p1.mass / p2.mass;
                        allTetas.push(rel.value / expVal);
                    }
                }
            });
        });

        if (allTetas.length === 0) {
            grid.innerHTML = '<div class="stat-item"><div class="stat-label">Нет данных</div><div class="stat-value">—</div></div>';
            return;
        }

        const count = allTetas.length;
        const avg = allTetas.reduce((a, b) => a + b, 0) / count;
        const min = Math.min(...allTetas);
        const max = Math.max(...allTetas);
        const in1pct = allTetas.filter(t => Math.abs(t - 1) < 0.01).length;
        const in5pct = allTetas.filter(t => Math.abs(t - 1) < 0.05).length;
        const in10pct = allTetas.filter(t => Math.abs(t - 1) < 0.10).length;

        grid.innerHTML = `
                <div class="stat-item">
                    <div class="stat-label">Всего отношений</div>
                    <div class="stat-value">${count}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Среднее Teta</div>
                    <div class="stat-value">${avg.toFixed(6)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Минимум Teta</div>
                    <div class="stat-value">${min.toFixed(6)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Максимум Teta</div>
                    <div class="stat-value">${max.toFixed(6)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">|Teta − 1| < 1%</div>
                    <div class="stat-value">${in1pct} (${(in1pct / count * 100).toFixed(1)}%)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">|Teta − 1| < 5%</div>
                    <div class="stat-value">${in5pct} (${(in5pct / count * 100).toFixed(1)}%)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">|Teta − 1| < 10%</div>
                    <div class="stat-value">${in10pct} (${(in10pct / count * 100).toFixed(1)}%)</div>
                </div>
            `;
    }

function exportToCSV() {
    const pList = filteredParticles;
    let csv = '\uFEFF'; // BOM для Excel
    const separator = ';';

    // Заголовок
    csv += 'Частица ↓ / Частица →' + separator;
    pList.forEach(p => {
        csv += `"${p.name} (${formatMass(p.mass)} kg, ${p.type})"` + separator;
    });
    csv += '\n';

    // Данные
    pList.forEach((p1, i) => {
        csv += `"${p1.name} (${formatMass(p1.mass)} kg, ${p1.type})"` + separator;
        pList.forEach((p2, j) => {
            if (i === j) {
                csv += '1' + separator;
            } else {
                const rel = getModelRatio(p1.id, p2.id);
                if (rel) {
                    const modelVal = rel.value;
                    const expVal = p1.mass / p2.mass;
                    const teta = modelVal / expVal;
                    csv += `${modelVal.toExponential(4)}${separator}`;
                } else {
                    csv += '-' + separator;
                }
            }
        });
        csv += '\n';
    });

    downloadFile(csv, 'mass_relations.csv', 'text/csv;charset=utf-8');
}

function exportToJSON() {
    const data = {
        constants: { K: K, N: N_val, lnN: lnN },
        particles: filteredParticles.map(p => ({
            id: p.id,
            name: p.name,
            mass: p.mass,
            type: p.type,
            ln: p.ln
        })),
        relations: []
    };

    filteredParticles.forEach((p1, i) => {
        filteredParticles.forEach((p2, j) => {
            if (i !== j) {
                const rel = getModelRatio(p1.id, p2.id);
                if (rel) {
                    const modelVal = rel.value;
                    const expVal = p1.mass / p2.mass;
                    data.relations.push({
                        pair: `${p1.name} / ${p2.name}`,
                        formula: rel.expr,
                        model_value: modelVal,
                        experimental_value: expVal,
                        teta: modelVal / expVal
                    });
                }
            }
        });
    });

    downloadFile(JSON.stringify(data, null, 2), 'mass_relations.json', 'application/json');
}

function copyTableToClipboard() {
    const pList = filteredParticles;
    let text = '';
    const separator = '\t';

    // Заголовок
    text += 'Частица ↓ / Частица →' + separator;
    pList.forEach(p => {
        text += `${p.name} (${formatMass(p.mass)})` + separator;
    });
    text += '\n';

    // Данные
    pList.forEach((p1, i) => {
        text += `${p1.name} (${formatMass(p1.mass)})` + separator;
        pList.forEach((p2, j) => {
            if (i === j) {
                text += '1' + separator;
            } else {
                const rel = getModelRatio(p1.id, p2.id);
                if (rel) {
                    text += rel.value.toExponential(4) + separator;
                } else {
                    text += '-' + separator;
                }
            }
        });
        text += '\n';
    });

    navigator.clipboard.writeText(text).then(() => {
        alert('Таблица скопирована в буфер обмена!');
    }).catch(() => {
        alert('Не удалось скопировать. Проверьте разрешения браузера.');
    });
}

function printTable() {
    const pList = filteredParticles;
    let html = '<html><head><meta charset="UTF-8"><title>Таблица отношений масс</title>';
    html += '<style>body{font-family:Arial;font-size:10px;}table{border-collapse:collapse;}th,td{border:1px solid #000;padding:3px 5px;text-align:center;}th{background:#ddd;}</style></head><body>';
    html += '<h2>Периодическая таблица отношений масс частиц (K=6)</h2>';
    html += '<table><thead><tr><th>Частица ↓ / →</th>';

    pList.forEach(p => {
        html += `<th>${p.name}<br><small>${formatMass(p.mass)}</small></th>`;
    });
    html += '</tr></thead><tbody>';

    pList.forEach((p1, i) => {
        html += '<tr>';
        html += `<td><b>${p1.name}</b><br><small>${formatMass(p1.mass)}</small></td>`;
        pList.forEach((p2, j) => {
            if (i === j) {
                html += '<td style="background:#90EE90;"><b>1</b></td>';
            } else {
                const rel = getModelRatio(p1.id, p2.id);
                if (rel) {
                    const teta = rel.value / (p1.mass / p2.mass);
                    const color = Math.abs(teta - 1) < 0.01 ? '#90EE90' :
                                 Math.abs(teta - 1) < 0.05 ? '#FFD700' : '#FFB6C1';
                    html += `<td style="background:${color};">${rel.value.toExponential(3)}</td>`;
                } else {
                    html += '<td>-</td>';
                }
            }
        });
        html += '</tr>';
    });

    html += '</tbody></table></body></html>';

    const printWindow = window.open('', '_blank');
    printWindow.document.write(html);
    printWindow.document.close();
    setTimeout(() => printWindow.print(), 500);
}

function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
